<!doctype html>
<html lang="pt-BR" data-theme="ink">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Boteco do Squad — palavras cruzadas de games, geek e cultura pop com placar e briga entre amigos." />
    <meta name="theme-color" content="#140f1f" />
    <!-- Site de turma, não listado: buscadores não indexam. Para listar, tire esta linha, o public/robots.txt e o
         cabeçalho X-Robots-Tag do firebase.json. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23140f1f'/%3E%3Crect x='2' y='2' width='5' height='5' fill='%23ff4fa3'/%3E%3Crect x='9' y='2' width='5' height='5' fill='%23f3e6c8'/%3E%3Crect x='2' y='9' width='5' height='5' fill='%23f3e6c8'/%3E%3Crect x='9' y='9' width='5' height='5' fill='%232ce8f5'/%3E%3C/svg%3E" />
    <title>Boteco do Squad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('lexicon.v1') || '{}');
        if (s.visual === 'ink' || s.visual === 'paper') document.documentElement.setAttribute('data-theme', s.visual);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
